name: Feature request
description: Propose a new platform, ranking rule, or workflow improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Mention affected platforms, example prompts, or expected output changes.

