[project]
name = "price-pilot"
version = "0.1.0"
description = "Give your AI Agent China shopping comparison across JD, Taobao, Pinduoduo, Xianyu, and Zhuanzhuan."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Wang Boyu"}]
keywords = [
    "ai-agent", "shopping", "price-comparison", "china-ecommerce",
    "jd", "taobao", "pinduoduo", "xianyu", "zhuanzhuan",
    "agent-skill", "cli", "product-ranking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
]

[project.scripts]
price-pilot = "price_pilot.cli:main"

[project.urls]
Homepage = "https://github.com/wby1121/price-pilot"
Repository = "https://github.com/wby1121/price-pilot"
Issues = "https://github.com/wby1121/price-pilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["price_pilot"]

[tool.hatch.build.targets.wheel.force-include]
"price_pilot/skill" = "price_pilot/skill"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
